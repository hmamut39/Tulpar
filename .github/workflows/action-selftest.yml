# The Tulpar check Action (action.yml), run from this repository against a component written with the
# design system: proves the Action installs, runs and reports, on every pull request.
name: Action self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The example project's design system
        run: cd examples/radix && npm ci --no-workspaces --ignore-scripts --no-audit --no-fund
      - uses: ./
        with:
          project: examples/radix
          files: examples/radix/check-ok/Clean.tsx
