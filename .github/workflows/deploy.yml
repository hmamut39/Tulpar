# Deploys main to Fly.io after CI passes, once the FLY_API_TOKEN secret exists
# (fly tokens create deploy -x 999999h; GitHub → Settings → Secrets → Actions). See docs/14-deploy.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip until Fly.io is set up
        id: ready
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: if [ -n "$FLY_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::FLY_API_TOKEN is not set; not deploying."; fi
      - if: steps.ready.outputs.ok
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.ready.outputs.ok
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.ready.outputs.ok
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
