# Tulpar as a GitHub Action: reviews a pull request's component changes against your design system (hard-coded
# colours, type and spacing; tokens that do not exist), whoever wrote the code, and marks each finding on its line.
# With verify: true it also builds and draws each changed component that tulpar.json lists under "verify", and
# compares it with its Figma frame. No AI model is called either way.
#
#   - uses: actions/checkout@v4
#   - run: npm ci                       # your project's dependencies (the design system must be installed)
#   - uses: hmamut39/Tulpar@main
#     with:
#       project: .                      # the folder with your tulpar.json (run `tulpar init` once)
#       verify: true                    # optional: compare listed components with their Figma frames
#       figma-token: ${{ secrets.FIGMA_TOKEN }}
name: Tulpar check
description: Hard-coded values and invented tokens in a pull request's components, and optionally each changed component compared with its Figma frame.
branding:
  icon: check-square
  color: purple
inputs:
  project:
    description: The folder that holds tulpar.json.
    default: "."
  files:
    description: Files to check (space separated). Default, in a pull request, its changed files; otherwise the whole project.
    default: ""
  verify:
    description: Also build, draw and compare the changed components listed in tulpar.json's "verify" with their Figma frames.
    default: "false"
  figma-token:
    description: A Figma personal access token (read-only), for verify. Keep it in your repository's secrets.
    default: ""
  github-token:
    description: Used to list a pull request's changed files.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install Tulpar
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Changed files
      id: changed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FILES: ${{ inputs.files }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        files="$FILES"
        if [ -z "$files" ] && [ -n "$PR" ]; then
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | select(.status != "removed") | .filename' | tr '\n' ' ')
          [ -n "$files" ] || files="-"
        fi
        echo "files=$files" >> "$GITHUB_OUTPUT"
    - name: Check
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        FILES: ${{ steps.changed.outputs.files }}
      run: |
        if [ "$FILES" = "-" ]; then echo "No changed files."; exit 0; fi
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/cli/src/main.ts" check "$PROJECT" $FILES --format github
    - name: Browser for verify
      if: inputs.verify == 'true'
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npx playwright install --with-deps --only-shell chromium
    - name: Verify against Figma
      if: inputs.verify == 'true'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        FILES: ${{ steps.changed.outputs.files }}
        FIGMA_TOKEN: ${{ inputs.figma-token }}
      run: |
        if [ "$FILES" = "-" ]; then echo "No changed files."; exit 0; fi
        if [ -z "$FIGMA_TOKEN" ]; then echo "::error title=Tulpar verify::verify needs figma-token (a read-only Figma token in your repository's secrets)."; exit 1; fi
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/cli/src/main.ts" verify-changed "$PROJECT" $FILES --format github
