# The build machine for Kotlin. No public address: the main server reaches it on Fly's private network, and it
# starts when asked and stops when idle, so it costs only while compiling. See Dockerfile.compose-builder.
app = "tulpar-compose-builder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.compose-builder"

[http_service]
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25

  # A version that cannot start fails its deploy, instead of "succeeding" and failing every Kotlin run.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# The Kotlin compiler alone asks for 4 GB, and Gradle for 2 GB.
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
