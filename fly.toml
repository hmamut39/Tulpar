# Fly.io deployment. First time: fly launch --no-deploy --copy-config, then
#   fly volumes create tulpar_data --size 3 --region iad
#   fly secrets set OPENAI_API_KEY=… TULPAR_ACCESS_CODES=code-for-alice,code-for-bob
#   fly deploy
# See docs/14-deploy.md.

app = "tulpar"
primary_region = "iad"
kill_signal = "SIGTERM"
# A Flutter generation can run for minutes: a stop or a deploy waits for it (lost runs are refunded anyway).
kill_timeout = "300s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TULPAR_TRUST_PROXY = "1"
  TULPAR_RUNS_PER_HOUR = "10"
  TULPAR_RUNS_PER_DAY = "100"

[http_service]
  internal_port = 8080
  force_https = true
  # Jobs live in memory: the machine stops only when no one is connected (the page polls while a job runs).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "tulpar_data"
  destination = "/app/data"

# Chromium renders every generated component: 2 GB keeps it comfortable.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
